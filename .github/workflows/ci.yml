name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Configure environment
        run: cp .env.example .env

      - name: Start Docker stack
        run: docker compose up -d --wait

      - name: Configure credentials in n8n
        run: |
          sed "s/CHANGE_ME_IN_PRODUCTION/postgres_secure_pass_change_in_prod/g" credentials/postgres_credential.example.json > /tmp/credentials.json
          docker cp /tmp/credentials.json triage_n8n:/tmp/credentials.json
          docker exec triage_n8n n8n import:credentials --input=/tmp/credentials.json
          docker exec triage_postgres psql -U postgres -d n8n_triage -c "UPDATE n8n_system.credentials_entity SET id = '1' WHERE name = 'Postgres Triage DB';" || true

      - name: Import and activate workflows
        run: |
          docker exec -u node triage_n8n n8n import:workflow --input=/workflows/error_handler_dlq.json
          docker exec -u node triage_n8n n8n import:workflow --input=/workflows/ai_support_triage_flow.json
          for id in $(docker exec triage_postgres psql -U postgres -d n8n_triage -t -A -c "SELECT id FROM n8n_system.workflow_entity;"); do
            echo "Publishing workflow ID: $id"
            docker exec -u node triage_n8n n8n publish:workflow --id="$id" || true
          done
          docker exec triage_postgres psql -U postgres -d n8n_triage -c "UPDATE n8n_system.workflow_entity SET active = true;"
          docker compose restart n8n
          timeout 60 bash -c 'until curl -sSf http://localhost:5678/healthz; do echo "Waiting for n8n webhook router..."; sleep 2; done'
          sleep 5

      - name: Inspect webhook registration and container logs
        run: |
          echo "=== Webhook Entity DB Table ==="
          docker exec triage_postgres psql -U postgres -d n8n_triage -c "SELECT * FROM n8n_system.webhook_entity;" || true
          echo "=== Workflow Entity DB Table ==="
          docker exec triage_postgres psql -U postgres -d n8n_triage -c "SELECT id, name, active FROM n8n_system.workflow_entity;" || true
          echo "=== Curl test endpoints ==="
          curl -i -X POST http://localhost:5678/webhook/support-ticket || true
          curl -i -X POST http://localhost:5678/webhook/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d || true
          curl -i -X POST http://localhost:5678/webhook/9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d/support-ticket || true
          echo "=== n8n container logs (last 50 lines) ==="
          docker logs --tail=50 triage_n8n

      - name: Run Playwright Tests
        run: npm test

      - name: Debug container logs on test failure
        if: failure()
        run: |
          echo "=== n8n Container Logs on Failure ==="
          docker logs --tail=100 triage_n8n
          echo "=== DLQ Entries ==="
          docker exec triage_postgres psql -U postgres -d n8n_triage -c "SELECT id, workflow_id, error_message, error_node, error_stack FROM app_triage.dead_letter_queue;" || true

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
