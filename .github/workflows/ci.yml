name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Configure environment
        run: cp .env.example .env

      - name: Start Docker stack
        run: docker compose up -d --wait

      - name: Configure credentials in n8n
        run: |
          sed "s/CHANGE_ME_IN_PRODUCTION/postgres_secure_pass_change_in_prod/g" credentials/postgres_credential.example.json > /tmp/credentials.json
          docker cp /tmp/credentials.json triage_n8n:/tmp/credentials.json
          docker exec triage_n8n n8n import:credentials --input=/tmp/credentials.json

      - name: Import and activate workflows
        run: |
          docker exec triage_n8n n8n import:workflow --input=/workflows/error_handler_dlq.json
          docker exec triage_n8n n8n import:workflow --input=/workflows/ai_support_triage_flow.json
          docker exec triage_n8n n8n update:workflow --all --active=true || true
          docker compose restart n8n
          timeout 60 bash -c 'until curl -sSf http://localhost:5678/healthz; do echo "Waiting for n8n webhook router..."; sleep 2; done'

      - name: Run Playwright Tests
        run: npm test

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
